name: Core journey
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  merge_group:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: core-journey-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium firefox webkit
      - run: bun run build
      - run: bunx playwright test -c playwright.core.config.ts
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: core-journey-failures
          path: test-results/
