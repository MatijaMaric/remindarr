name: Sync bun.lock on Dependabot PRs

on:
  pull_request:
    branches: [master]
    # Only npm dependabot PRs touch these; actions/docker bumps never change bun.lock.
    paths:
      - "**/package.json"
      - "**/bun.lock"

permissions:
  contents: write
  pull-requests: read

jobs:
  sync-lockfile:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      # Prefer WORKFLOW_PAT so the lockfile commit retriggers CI. Fall back to
      # GITHUB_TOKEN when the secret is missing or expired (#1088) so the
      # lockfile still gets regenerated instead of failing the whole job.
      - uses: actions/checkout@v7
        id: checkout-pat
        continue-on-error: true
        if: ${{ secrets.WORKFLOW_PAT != '' }}
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.WORKFLOW_PAT }}

      - uses: actions/checkout@v7
        if: ${{ secrets.WORKFLOW_PAT == '' || steps.checkout-pat.outcome == 'failure' }}
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ github.token }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Regenerate lockfiles
        run: bun install --ignore-scripts

      - name: Commit & push if lockfiles changed
        run: |
          if [[ -n "$(git status --porcelain bun.lock frontend/bun.lock)" ]]; then
            git config user.name 'dependabot[bot]'
            git config user.email '49699333+dependabot[bot]@users.noreply.github.com'
            git add bun.lock frontend/bun.lock
            git commit -m "chore(deps): regenerate bun.lock"
            git push
          else
            echo "Lockfiles already in sync."
          fi
